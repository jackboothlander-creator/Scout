<style>
:root{--bg:#f4f5ef;--card:#fffef9;--ink:#112018;--muted:#6c7a72;--line:#dfe4de;--deep:#0b1813;--lime:#c8ff4d;--green:#1d7650;--soft:#edf2ed;--amber:#f7e6a7;--red:#f6d8d3}*{box-sizing:border-box}html,body{margin:0;background:#dfe5df;color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}button{font:inherit}.shell{max-width:800px;margin:auto;min-height:100vh;background:var(--bg)}.top{position:sticky;top:0;z-index:40;background:rgba(11,24,19,.98);backdrop-filter:blur(15px);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 11px}.brand{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand-left{display:flex;gap:10px;align-items:center}.logo{width:40px;height:40px;border-radius:13px;overflow:hidden;flex:none}.logo svg{width:100%;height:100%;display:block}.brand h1{margin:0;font-size:21px;letter-spacing:-.04em}.brand small{display:block;color:#93a69c;font-size:9px;letter-spacing:.08em;margin-top:2px}.updated{font-size:10px;color:#9eb1a6;text-align:right}.controls{position:sticky;top:61px;z-index:30;background:rgba(244,245,239,.97);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:10px 12px}.control-row{display:flex;gap:8px}.filter-btn{flex:1;display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);background:#fff;border-radius:14px;padding:10px 12px;color:var(--ink);font-weight:850;font-size:12px}.filter-btn .count{background:var(--deep);color:#fff;border-radius:999px;padding:3px 7px;font-size:9px}.clear-btn{border:0;background:transparent;color:var(--green);font-weight:850;font-size:11px;padding:0 5px}.chips{display:flex;gap:6px;overflow:auto;margin-top:8px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 8px;font-size:9px;font-weight:750;color:#617067}.chip.active{background:#e8f5ec;color:#185a3e;border-color:#cfe4d5}main{padding:13px 12px 45px}.hero{background:var(--deep);color:#fff;border-radius:22px;padding:17px;margin-bottom:14px}.eyebrow{font-size:9px;font-weight:900;letter-spacing:.09em;color:var(--lime)}.hero h2{font-size:25px;line-height:1.05;margin:7px 0 7px;letter-spacing:-.045em}.hero p{font-size:12px;line-height:1.52;color:#cedbd3;margin:0}.hero-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.hero-pill{font-size:9px;font-weight:800;background:#20372b;border-radius:999px;padding:5px 7px;color:#dce8e1}.section{margin:19px 0}.section-head{display:flex;align-items:end;justify-content:space-between;margin:0 3px 8px}.section-head h3{margin:0;font-size:18px;letter-spacing:-.03em}.section-head span{font-size:9px;color:var(--muted)}.top5{background:#fff;border:1px solid var(--line);border-radius:19px;overflow:hidden}.rank-row{display:grid;grid-template-columns:31px 1fr auto;gap:9px;align-items:center;padding:11px 12px;border-bottom:1px solid #edf0ed}.rank-row:last-child{border-bottom:0}.rank{width:27px;height:27px;border-radius:9px;background:var(--deep);color:var(--lime);display:grid;place-items:center;font-size:11px;font-weight:950}.rank-title{font-size:12px;font-weight:850;line-height:1.2}.rank-sub{font-size:9px;color:var(--muted);margin-top:2px}.rank-score{font-size:11px;font-weight:900}.gap-strip{display:flex;gap:8px;overflow:auto;scrollbar-width:none}.gap-strip::-webkit-scrollbar{display:none}.gap-card{min-width:220px;background:#eef6f0;border:1px solid #d7e8dc;border-radius:16px;padding:12px}.gap-card b{font-size:12px;display:block;line-height:1.2}.gap-card p{font-size:10px;color:#597066;line-height:1.4;margin:5px 0 0}.card{background:var(--card);border:1px solid var(--line);border-radius:19px;padding:14px;margin-bottom:10px;box-shadow:0 5px 16px rgba(11,24,19,.035)}.card-top{display:flex;justify-content:space-between;gap:10px}.signal{font-size:9px;font-weight:900;letter-spacing:.055em;color:var(--green);text-transform:uppercase}.badges{display:flex;gap:5px;align-items:center}.action{font-size:9px;font-weight:950;border-radius:999px;padding:5px 7px}.buy{background:#dff4e5;color:#16623f}.watch{background:var(--amber);color:#725300}.pass{background:var(--red);color:#8b3028}.score{border:0;background:var(--soft);border-radius:999px;padding:5px 7px;font-size:9px;font-weight:900;color:var(--ink)}.card h4{font-size:16px;line-height:1.16;margin:7px 0 6px;letter-spacing:-.025em}.summary{font-size:11px;line-height:1.48;color:#5e6b63;margin:0}.buyer{margin-top:9px;padding:10px 11px;background:#eef4ef;border-radius:13px;font-size:11px;line-height:1.42}.buyer b{color:#175f42}.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}.tag{font-size:8.5px;font-weight:800;color:#6a786f;border:1px solid var(--line);border-radius:999px;padding:4px 6px;background:#fff}.ukgap{background:#e7f7ea;color:#17623f;border-color:#cce8d3}.source{display:inline-block;margin-top:9px;color:#185f42;text-decoration:none;font-size:10px;font-weight:850}.score-panel{display:none;margin-top:9px;padding:9px;border-radius:12px;background:#f6f7f3}.score-panel.open{display:block}.score-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.score-cell{text-align:center}.score-cell b{display:block;font-size:12px}.score-cell span{font-size:7.5px;color:var(--muted)}.swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.swatch{background:#fff;border:1px solid var(--line);border-radius:15px;padding:9px}.colour{height:46px;border-radius:11px;margin-bottom:7px}.swatch b{font-size:10px;line-height:1.2;display:block}.swatch span{font-size:8px;color:var(--muted)}.empty{padding:45px 15px;text-align:center;color:var(--muted);font-size:12px}.modal-wrap{position:fixed;inset:0;background:rgba(7,15,11,.6);z-index:100;display:none;align-items:flex-end}.modal-wrap.open{display:flex}.modal{width:100%;max-height:88vh;background:#f7f8f3;border-radius:24px 24px 0 0;padding:13px 13px calc(15px + env(safe-area-inset-bottom));overflow:auto}.modal-head{position:sticky;top:-13px;background:#f7f8f3;padding:5px 0 10px;display:flex;justify-content:space-between;align-items:center;z-index:3}.modal-head h3{margin:0;font-size:20px}.done{border:0;background:var(--deep);color:#fff;border-radius:12px;padding:9px 13px;font-weight:850}.modal-tools{display:flex;gap:8px;margin-bottom:10px}.tool{border:1px solid var(--line);background:#fff;border-radius:11px;padding:8px 10px;font-size:10px;font-weight:800}.dept{background:#fff;border:1px solid var(--line);border-radius:16px;margin:8px 0;overflow:hidden}.dept-head{display:flex;justify-content:space-between;align-items:center;padding:11px 12px;font-weight:900;font-size:12px;background:#fbfcf9}.dept-list{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}.cat-opt{display:flex;align-items:center;gap:7px;padding:9px 10px;font-size:10px;border-bottom:1px solid #eef0ed}.cat-opt:nth-child(odd){border-right:1px solid #eef0ed}.cat-opt input{accent-color:#183f2f}.dept-count{font-size:9px;color:var(--muted);font-weight:700}@media(min-width:700px){body{padding:15px}.shell{border-radius:28px;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,.1)}.modal-wrap{align-items:center;justify-content:center}.modal{max-width:650px;border-radius:24px;max-height:82vh}.controls{top:60px}}</style></head>
<body><div class="shell"><header class="top"><div class="brand"><div class="brand-left"><div class="logo"><svg viewBox="0 0 180 180"><rect width="180" height="180" rx="38" fill="#c8ff4d"/><path fill="#0b1813" d="M50 43h91l-17 25H72c-7 0-11 3-11 8 0 4 4 7 11 7h35c21 0 34 10 34 28 0 17-14 30-38 30H39l17-25h49c8 0 12-3 12-8 0-5-4-7-12-7H70c-22 0-34-10-34-28 0-18 14-30 38-30H50z"/></svg></div><div><h1>Scout</h1><small>BUYER TREND INTELLIGENCE</small></div></div><div class="updated" id="updated">Loading…</div></div></header><div class="controls"><div class="control-row"><button class="filter-btn" onclick="openFilters()"><span>Departments & categories</span><span class="count" id="filterCount">All</span></button><button class="clear-btn" onclick="clearFilters()">Reset</button></div><div class="chips" id="selectedChips"><span class="chip active">All categories</span></div></div><main><div id="content" class="empty">Loading today’s Scout brief…</div></main></div><div class="modal-wrap" id="filterModal" onclick="if(event.target===this)closeFilters()"><div class="modal"><div class="modal-head"><h3>Choose categories</h3><button class="done" onclick="closeFilters()">Done</button></div><div class="modal-tools"><button class="tool" onclick="selectAll()">Select all</button><button class="tool" onclick="clearFilters(false)">Clear</button></div><div id="taxonomy"></div></div></div>
<script>
const SB_URL='https://wxvfysedpfcxlcistvak.supabase.co',SB_KEY='sb_publishable_n7mxTZt5XE4cKPB4kWzh0w_jeENKixy';let rows=[],selected=new Set(),TAX={};function key(d,c){return String(d||'Other')+'::'+String(c||'General')}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function buildTax(){const map={};rows.forEach(r=>{const d=r.department||'Other',c=r.category||'General';if(!map[d])map[d]=new Set();map[d].add(c)});TAX=Object.fromEntries(Object.keys(map).sort().map(d=>[d,[...map[d]].sort()]));}function renderTax(){let h='';Object.entries(TAX).forEach(([d,cats])=>{const active=cats.filter(c=>selected.has(key(d,c))).length;h+=`<div class="dept"><div class="dept-head"><span>${esc(d)} <span class="dept-count">${cats.length} categories</span></span><button class="tool" data-dept="${esc(d)}" onclick="toggleDept(this.dataset.dept)">${active===cats.length&&cats.length?'Clear':'Select all'}</button></div><div class="dept-list">`;cats.forEach(c=>h+=`<label class="cat-opt"><input type="checkbox" data-key="${esc(key(d,c))}" ${selected.has(key(d,c))?'checked':''} onchange="toggleOne(this)"><span>${esc(c)}</span></label>`);h+='</div></div>'});document.getElementById('taxonomy').innerHTML=h||'<div class="empty">No categories in today’s brief.</div>'}function openFilters(){renderTax();document.getElementById('filterModal').classList.add('open')}function closeFilters(){document.getElementById('filterModal').classList.remove('open');render()}function toggleOne(el){el.checked?selected.add(el.dataset.key):selected.delete(el.dataset.key);updateFilterUI()}function toggleDept(d){const cats=TAX[d]||[],all=cats.length&&cats.every(c=>selected.has(key(d,c)));cats.forEach(c=>all?selected.delete(key(d,c)):selected.add(key(d,c)));renderTax();updateFilterUI()}function selectAll(){selected=new Set(Object.entries(TAX).flatMap(([d,c])=>c.map(x=>key(d,x))));renderTax();updateFilterUI()}function clearFilters(doRender=true){selected.clear();updateFilterUI();if(document.getElementById('filterModal').classList.contains('open'))renderTax();if(doRender)render()}function updateFilterUI(){const n=selected.size;document.getElementById('filterCount').textContent=n?n:'All';let chips=n?[...selected].slice(0,8).map(x=>`<span class="chip active">${esc(x.split('::')[1])}</span>`).join(''):'<span class="chip active">All categories</span>';if(n>8)chips+=`<span class="chip">+${n-8} more</span>`;document.getElementById('selectedChips').innerHTML=chips}function filtered(){if(!selected.size)return rows;return rows.filter(r=>selected.has(key(r.department,r.category)))}function actionOf(r){const a=((r.metadata||{}).buyer_action||'WATCH').toUpperCase();return ['BUY','WATCH','PASS'].includes(a)?a:'WATCH'}function direction(r){const d=(r.metadata||{}).direction;return d==='up'?'↑ rising':d==='down'?'↓ cooling':'→ stable'}function sectionTitle(s){return{breaking:['🔥 Breaking now','What is moving fastest'],future:['🚀 Next 6–12 months','Signals worth planning for'],market:['🌍 Market watch','What other markets are telling us'],colour:['🎨 Colour & aesthetic watch','Directions crossing into products'],cooling_off:['📉 Cooling off','Things losing novelty or becoming saturated']}[s]||[s,'']}function scorePanel(r){const s=(r.metadata||{}).score_components||{};if(!Object.keys(s).length)return'';const labs=[['momentum','Momentum'],['uk_fit','UK fit'],['value_retail_fit','Value fit'],['margin_potential','Margin'],['competition','Competition']];return `<div class="score-panel" id="sp${r.id}"><div class="score-grid">${labs.map(([k,l])=>`<div class="score-cell"><b>${esc(s[k]??'–')}</b><span>${l}</span></div>`).join('')}</div></div>`}function card(r){const m=r.metadata||{},a=actionOf(r),markets=(m.markets||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join('');return `<article class="card"><div class="card-top"><div class="signal">${esc(r.department)} · ${esc(r.category||'Trend')}</div><div class="badges"><span class="action ${a.toLowerCase()}">${a}</span><button class="score" onclick="document.getElementById('sp${r.id}')?.classList.toggle('open')">${esc(r.buyer_score||'–')}/100</button></div></div><h4>${esc(r.title)}</h4><p class="summary">${esc(r.reason||'')}</p>${r.buyer_verdict?`<div class="buyer"><b>Buyer view:</b> ${esc(r.buyer_verdict)}</div>`:''}<div class="tags">${m.uk_gap?'<span class="tag ukgap">⚡ UK GAP</span>':''}${m.horizon?`<span class="tag">${esc(m.horizon)}</span>`:''}${m.sourcing_window?`<span class="tag">Source: ${esc(m.sourcing_window)}</span>`:''}${m.seasonality?`<span class="tag">${esc(m.seasonality)}</span>`:''}<span class="tag">${direction(r)}</span>${markets}</div>${r.source_url?`<a class="source" href="${esc(r.source_url)}" target="_blank" rel="noopener">Evidence →</a>`:''}${scorePanel(r)}</article>`}function swatch(r){const m=r.metadata||{};return `<div class="swatch"><div class="colour" style="background:${esc(m.colour_hex||'#dfe4de')}"></div><b>${esc(r.title)}</b><span>${esc(direction(r))}</span></div>`}function render(){const list=filtered().sort((a,b)=>(b.buyer_score||0)-(a.buyer_score||0));if(!list.length){document.getElementById('content').innerHTML='<div class="empty">No Scout signals match these categories today.</div>';return}const edition=list[0]?.edition_date||'',top=list.slice(0,5),gaps=list.filter(r=>(r.metadata||{}).uk_gap).slice(0,8);document.getElementById('updated').textContent=edition?'Updated '+edition:'Today';let out=`<section class="hero"><div class="eyebrow">SCOUT BRIEF · ${esc(edition)}</div><h2>${esc(top[0].title)}</h2><p>${esc(top[0].buyer_verdict||top[0].reason||'')}</p><div class="hero-meta"><span class="hero-pill">${list.length} signals</span><span class="hero-pill">${Object.keys(TAX).length} departments</span><span class="hero-pill">${selected.size?selected.size+' categories selected':'All categories'}</span></div></section>`;out+=`<section class="section"><div class="section-head"><h3>Top 5 opportunities</h3><span>Changes with your filters</span></div><div class="top5">${top.map((r,i)=>`<div class="rank-row"><div class="rank">${i+1}</div><div><div class="rank-title">${esc(r.title)}</div><div class="rank-sub">${esc(r.department)} · ${esc(r.category)} · ${actionOf(r)}</div></div><div class="rank-score">${esc(r.buyer_score||'–')}</div></div>`).join('')}</div></section>`;if(gaps.length)out+=`<section class="section"><div class="section-head"><h3>⚡ UK gap</h3><span>Working elsewhere, early here</span></div><div class="gap-strip">${gaps.map(r=>`<div class="gap-card"><b>${esc(r.title)}</b><p>${esc(r.buyer_verdict||r.reason||'')}</p></div>`).join('')}</div></section>`;const colours=list.filter(r=>(r.metadata||{}).section==='colour');if(colours.length)out+=`<section class="section"><div class="section-head"><h3>🎨 Colour watch</h3><span>${colours.length} signals</span></div><div class="swatches">${colours.slice(0,6).map(swatch).join('')}</div></section>`;['breaking','future','market','cooling_off'].forEach(sec=>{const items=list.filter(r=>(r.metadata||{}).section===sec);if(!items.length)return;const [t,sub]=sectionTitle(sec);out+=`<section class="section"><div class="section-head"><h3>${t}</h3><span>${sub}</span></div>${items.map(card).join('')}</section>`});document.getElementById('content').innerHTML=out}async function loadData(){document.getElementById('content').innerHTML='<div class="empty">Loading today’s Scout brief…</div>';try{const res=await fetch(`${SB_URL}/rest/v1/trends?select=*&is_visible=eq.true&signal_type=eq.summary&order=buyer_score.desc`,{headers:{apikey:SB_KEY}});if(!res.ok)throw new Error(await res.text());rows=await res.json();buildTax();updateFilterUI();render()}catch(e){document.getElementById('content').innerHTML='<div class="empty">Scout couldn’t load today’s brief. Try again shortly.</div>'}}loadData();
</script></body></html>
