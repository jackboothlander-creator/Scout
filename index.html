<style>:root{--bg:#f4f5ef;--card:#fffef9;--ink:#112018;--muted:#6c7a72;--line:#dfe4de;--deep:#0b1813;--lime:#c8ff4d;--green:#1d7650;--soft:#edf2ed}*{box-sizing:border-box}html,body{margin:0;background:#dde3de;color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}body{min-height:100vh}.shell{max-width:760px;margin:0 auto;min-height:100vh;background:var(--bg)}.top{position:sticky;top:0;z-index:30;background:rgba(11,24,19,.97);backdrop-filter:blur(14px);color:white;padding:calc(12px + env(safe-area-inset-top)) 16px 12px}.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand-left{display:flex;align-items:center;gap:10px}.logo{width:40px;height:40px;border-radius:13px;overflow:hidden;flex:0 0 auto}.logo svg{display:block;width:100%;height:100%}.brand h1{font-size:20px;margin:0;letter-spacing:-.03em}.brand small{display:block;color:#91a69a;font-size:10px;margin-top:3px;letter-spacing:.05em}.refresh{border:0;background:#1d3328;color:white;border-radius:13px;padding:10px 12px;font-size:12px;font-weight:800}.tabs{position:sticky;top:65px;z-index:20;background:var(--bg);display:flex;gap:7px;overflow:auto;padding:10px 12px;border-bottom:1px solid var(--line);scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{white-space:nowrap;border:1px solid var(--line);background:white;color:#5f6d65;border-radius:999px;padding:8px 12px;font-size:11px;font-weight:800}.tab.on{background:var(--deep);color:white;border-color:var(--deep)}.main{padding:14px 12px 40px}.hero{background:var(--deep);color:white;border-radius:24px;padding:18px;margin-bottom:14px}.kicker{color:var(--lime);font-size:10px;font-weight:900;letter-spacing:.08em}.hero h2{font-size:25px;line-height:1.05;margin:7px 0 8px;letter-spacing:-.04em}.hero p{font-size:13px;line-height:1.55;color:#d0dbd4;margin:0}.meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}.pill{font-size:10px;font-weight:800;padding:6px 8px;border-radius:999px;background:#20362b;color:#d8e5dd}.section{margin:20px 0}.section-head{display:flex;align-items:end;justify-content:space-between;margin:0 3px 9px}.section-head h3{margin:0;font-size:19px;letter-spacing:-.03em}.section-head span{font-size:10px;color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:15px;margin-bottom:10px;box-shadow:0 5px 18px rgba(11,24,19,.04)}.card-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.signal{font-size:9px;font-weight:900;letter-spacing:.06em;color:var(--green);text-transform:uppercase}.score{flex:0 0 auto;border-radius:999px;background:var(--soft);padding:6px 8px;font-size:10px;font-weight:900}.card h4{font-size:17px;line-height:1.15;margin:7px 0 7px;letter-spacing:-.025em}.summary{font-size:12px;line-height:1.5;color:#5e6b63;margin:0}.buyer{margin-top:11px;padding:11px 12px;border-radius:14px;background:#eef4ef;font-size:12px;line-height:1.45}.buyer b{color:#175f42}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.tag{font-size:9px;font-weight:800;color:#6f7d75;border:1px solid var(--line);border-radius:999px;padding:5px 7px;background:#fff}.dir-up{color:#13744a}.dir-down{color:#b74d47}.dir-flat{color:#6c7a72}.empty,.loading{padding:60px 20px;text-align:center;color:var(--muted)}@media(min-width:700px){body{padding:16px 0}.shell{border-radius:28px;overflow:hidden;box-shadow:0 0 40px rgba(0,0,0,.10);min-height:calc(100vh - 32px)}.main{padding:18px 20px 50px}.tabs{padding-left:20px;padding-right:20px}.top{padding-left:20px;padding-right:20px}}</style></head><body><div class="shell"><header class="top"><div class="brand"><div class="brand-left"><div class="logo"><svg viewBox="0 0 180 180" aria-label="Scout"><rect width="180" height="180" rx="38" fill="#c8ff4d"/><path fill="#0b1813" d="M50 43h91l-17 25H72c-7 0-11 3-11 8 0 4 4 7 11 7h35c21 0 34 10 34 28 0 17-14 30-38 30H39l17-25h49c8 0 12-3 12-8 0-5-4-7-12-7H70c-22 0-34-10-34-28 0-18 14-30 38-30H50z"/></svg></div><div><h1>Scout</h1><small>DAILY BUYER INTELLIGENCE</small></div></div><button class="refresh" onclick="loadData()">Refresh</button></div></header><div class="tabs"><button class="tab on" data-filter="All">All</button><button class="tab" data-filter="Electrical">Electrical</button><button class="tab" data-filter="DIY">DIY</button><button class="tab" data-filter="Car">Car</button><button class="tab" data-filter="Kitchen">Kitchen</button><button class="tab" data-filter="Health & Beauty">Beauty</button><button class="tab" data-filter="Cross-category">Cross-category</button></div><main class="main"><div id="content" class="loading">Loading today’s Scout brief…</div></main></div><script>const SB_URL="https://wxvfysedpfcxlcistvak.supabase.co";const SB_KEY="sb_publishable_n7mxTZt5XE4cKPB4kWzh0w_jeENKixy";let rows=[],active="All";document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===b));active=b.dataset.filter;render()});function arrow(d){if(d==="up")return'<span class="dir-up">↑ rising</span>';if(d==="down")return'<span class="dir-down">↓ cooling</span>';return'<span class="dir-flat">→ stable</span>'}function markets(r){return((r.metadata&&r.metadata.markets)||[]).map(x=>`<span class="tag">${x}</span>`).join("")}function sectionTitle(s){return{breaking:["🔥 Breaking now","What is moving fastest"],future:["🚀 Next 6–12 months","Signals worth planning for"],market:["🌍 Market watch","What other markets are telling us"],colour:["🎨 Colour & aesthetic watch","Directions crossing into products"],cooling_off:["📉 Cooling off","Things losing novelty or becoming saturated"]}[s]||[s,""]}function card(r){const m=r.metadata||{};return`<article class="card"><div class="card-top"><div><div class="signal">${r.department} · ${r.category||"Trend"}</div></div><div class="score">${r.buyer_score} / 100</div></div><h4>${r.title}</h4><p class="summary">${r.reason||""}</p>${r.buyer_verdict?`<div class="buyer"><b>Buyer view:</b> ${r.buyer_verdict}</div>`:""}<div class="tags">${m.horizon?`<span class="tag">${m.horizon}</span>`:""}${arrow(m.direction)}${markets(r)}${r.evidence_status?`<span class="tag">${r.evidence_status==="verified"?"Verified evidence":"Inferred signal"}</span>`:""}</div></article>`}function filtered(){return active==="All"?rows:rows.filter(r=>r.department===active)}function render(){const list=filtered();if(!list.length){document.getElementById("content").innerHTML='<div class="empty">No Scout signals in this view today.</div>';return}const edition=list[0]?.edition_date||"",breaking=list.filter(r=>(r.metadata||{}).section==="breaking").sort((a,b)=>b.buyer_score-a.buyer_score),top=breaking[0]||list[0];let out=`<section class="hero"><div class="kicker">SCOUT BRIEF · ${edition}</div><h2>${top.title}</h2><p>${top.reason||""} ${top.buyer_verdict||""}</p><div class="meta"><span class="pill">${list.length} signals</span><span class="pill">Daily overwrite</span><span class="pill">Fast scan</span></div></section>`;["breaking","future","market","colour","cooling_off"].forEach(sec=>{const items=list.filter(r=>(r.metadata||{}).section===sec).sort((a,b)=>b.buyer_score-a.buyer_score);if(!items.length)return;const[t,sub]=sectionTitle(sec);out+=`<section class="section"><div class="section-head"><h3>${t}</h3><span>${sub}</span></div>${items.map(card).join("")}</section>`});document.getElementById("content").className="";document.getElementById("content").innerHTML=out}async function loadData(){document.getElementById("content").className="loading";document.getElementById("content").textContent="Refreshing today’s Scout brief…";try{const res=await fetch(`${SB_URL}/rest/v1/trends?select=*&is_visible=eq.true&signal_type=eq.summary&order=buyer_score.desc`,{headers:{apikey:SB_KEY}});if(!res.ok)throw new Error(await res.text());rows=await res.json();render()}catch(e){document.getElementById("content").className="empty";document.getElementById("content").textContent="Scout couldn’t load today’s brief. Try refresh."}}loadData();</script></body></html>
